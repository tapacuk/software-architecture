<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Бронювання залів</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Система управління Антикафе</h1>

    <div class="section">
      <h2>Доступні зали:</h2>
      <ul id="rooms-list"></ul>
    </div>

    <div class="section">
      <h2>Нове бронювання</h2>
      <label
        >ID зали:
        <input type="text" id="input-room-id" placeholder="напр. h1" /></label
      ><br /><br />
      <label
        >Час початку: <input type="datetime-local" id="input-start" /></label
      ><br /><br />
      <label
        >Час завершення: <input type="datetime-local" id="input-end" /></label
      ><br /><br />
      <label
        ><input type="checkbox" id="input-turnkey" /> Захід «під ключ» (Дитячий
        ДН)</label
      ><br /><br />

      <button id="btn-book">Забронювати</button>
    </div>

    <script src="dist/app.js"></script>
  </body>
</html>
